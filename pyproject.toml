[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naive-e-slotssm"
version = "0.1.0"
description = "Slot-based state-space modeling and OpenVLA fine-tuning"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["prismatic*"]
